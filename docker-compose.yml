services:
  postgres:
    image: postgres:16-alpine
    container_name: detailbid-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: detailbid
      POSTGRES_PASSWORD: detailbid
      POSTGRES_DB: detailbid
    ports:
      - '5432:5432'
    volumes:
      - detailbid_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U detailbid']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  detailbid_pgdata:
